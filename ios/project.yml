name: KumuTracker
options:
  bundleIdPrefix: com.kumu.demo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  KumuTracker:
    type: application
    platform: iOS
    sources:
      - KumuTracker
    info:
      path: KumuTracker/Info.plist
      properties:
        CFBundleDisplayName: KUMU
        NSCameraUsageDescription: 店内トラッキングにカメラを使用します（座標と服装タグのみ送信）
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kumu.demo.tracker
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
